# 开发用 broker 配置：允许匿名、开启持久化。
# 生产环境必须关闭 allow_anonymous，改用 password_file / TLS。

listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

# 本地演示不做认证；上线前务必改成 false
allow_anonymous true

# 持久化：retain 的 status 消息与 QoS1 未确认消息在重启后不丢
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
